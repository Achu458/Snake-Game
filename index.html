<!DOCTYPE html>
<html>
<head>
    <title>Snake Game</title>

    <style>
        body {
            background: black;
            color: white;
            text-align: center;
            font-family: Arial;
        }

        canvas {
            background: #111;
            border: 3px solid white;
        }

        h1 {
            color: lime;
        }
    </style>
</head>

<body>

<h1>🐍 Snake Game</h1>
<p>Use Arrow Keys to Move</p>

<canvas id="game" width="600" height="600"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const size = 25;

let snake = [
    {x: 100, y: 100},
    {x: 75, y: 100},
    {x: 50, y: 100}
];

let food = {
    x: Math.floor(Math.random() * 24) * size,
    y: Math.floor(Math.random() * 24) * size
};

let direction = "RIGHT";
let score = 0;
let gameOver = false;

document.addEventListener("keydown", changeDirection);

function changeDirection(event) {

    if (event.key === "ArrowUp" && direction !== "DOWN")
        direction = "UP";

    if (event.key === "ArrowDown" && direction !== "UP")
        direction = "DOWN";

    if (event.key === "ArrowLeft" && direction !== "RIGHT")
        direction = "LEFT";

    if (event.key === "ArrowRight" && direction !== "LEFT")
        direction = "RIGHT";
}

function drawGame() {

    if (gameOver) {
        ctx.fillStyle = "red";
        ctx.font = "50px Arial";
        ctx.fillText("GAME OVER", 160, 280);

        ctx.fillStyle = "white";
        ctx.font = "25px Arial";
        ctx.fillText("Score: " + score, 250, 330);
        return;
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Food
    ctx.fillStyle = "red";
    ctx.fillRect(food.x, food.y, size, size);

    // Snake
    snake.forEach((part, index) => {
        ctx.fillStyle = index === 0 ? "lime" : "green";
        ctx.fillRect(part.x, part.y, size, size);
    });

    // Score
    ctx.fillStyle = "white";
    ctx.font = "20px Arial";
    ctx.fillText("Score: " + score, 10, 25);

    moveSnake();
}

function moveSnake() {

    let head = {
        x: snake[0].x,
        y: snake[0].y
    };

    if (direction === "UP")
        head.y -= size;

    if (direction === "DOWN")
        head.y += size;

    if (direction === "LEFT")
        head.x -= size;

    if (direction === "RIGHT")
        head.x += size;

    // Wall collision
    if (
        head.x < 0 ||
        head.x >= canvas.width ||
        head.y < 0 ||
        head.y >= canvas.height
    ) {
        gameOver = true;
        return;
    }

    // Body collision
    for (let part of snake) {
        if (head.x === part.x && head.y === part.y) {
            gameOver = true;
            return;
        }
    }

    snake.unshift(head);

    // Food collision
    if (head.x === food.x && head.y === food.y) {

        score += 10;

        food = {
            x: Math.floor(Math.random() * 24) * size,
            y: Math.floor(Math.random() * 24) * size
        };

    } else {
        snake.pop();
    }
}

setInterval(drawGame, 100);

</script>

</body>
</html>
